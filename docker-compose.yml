# Absensi — local development services
#
# ADR-0005: PostgreSQL 17 is the project baseline in development, test and CI.
# The host's Homebrew PostgreSQL 14 is deliberately NOT used — it reaches end of
# life in November 2026, inside this project's build window. Use this container's
# psql (`docker compose exec postgres psql -U absensi absensi`) rather than the
# host client, so a 14 client never talks to a 17 server.

services:
  postgres:
    image: postgres:17-alpine
    container_name: absensi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-absensi}
      POSTGRES_USER: ${DB_USERNAME:-absensi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      # Deterministic collation. Without this the image inherits the host locale,
      # which changes ORDER BY results between machines and between dev and CI.
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Host 5433, not 5432 — the Homebrew PostgreSQL 14 may already hold 5432.
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - absensi-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-absensi} -d ${DB_DATABASE:-absensi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: absensi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT_HOST:-6380}:6379"
    volumes:
      - absensi-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  absensi-pgdata:
  absensi-redisdata:
